version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: sistema_ocorrencias_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sistema_ocorrencias}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
